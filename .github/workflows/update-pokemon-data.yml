name: Update Pokemon Data

on:
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run script to fetch data and generate zip
        run: |
          cd pokemon_data
          python update_data.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f pokemon_data/data.zip ]; then
            git rm --cached pokemon_data/data.zip || true
            rm -f pokemon_data/data.zip
          fi
          git add pokemon_data/data_part*.bin pokemon_data/version.json

          # Only commit if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "chore: Update Pokemon data and images [skip ci]"
            git push
          else
            echo "No changes in pokemon_data files"
          fi
